spring.application.name=aquarius-circus
spring.config.import=optional:file:./.env.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_alunos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Mantido apenas para o desenvolvimento local existente; produção deve usar migrações.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
api.security.token.secret=${JWT_SECRET}
app.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Envio real depende de um provedor SMTP; não há senha ou token de recuperação em logs.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.recuperacao.remetente=${SMTP_FROM:}
app.recuperacao.url=${PASSWORD_RESET_URL:http://localhost:5173/redefinir-senha}
