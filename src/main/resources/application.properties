# ===============================
# CONFIGURAÇÕES DO POSTGRESQL
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/gestao_alunos
spring.datasource.username=postgres
spring.datasource.password=P@ssw0rdjv
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# CONFIGURAÇÕES DO HIBERNATE / JPA
# ===============================
# O comando "update" cria as tabelas automaticamente se não existirem, e atualiza caso você mude o código
spring.jpa.hibernate.ddl-auto=update

# Mostra no console do IntelliJ os comandos SQL que o Spring está executando no banco
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialeto do banco
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# A chave deve ter pelo menos 32 caracteres (256 bits) para ser segura com o algoritmo HS256
api.security.token.secret=UmaChaveSuperSecretaParaAGestaoDeAlunos!@#