spring.application.name=aquarius-circus
spring.config.import=optional:file:./.env.properties
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestao_alunos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Mantido apenas para o desenvolvimento local existente; produção deve usar migrações.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
api.security.token.secret=${JWT_SECRET}
app.time-zone=${APP_TIME_ZONE:America/Sao_Paulo}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
